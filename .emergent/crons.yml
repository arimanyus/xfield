crons:
  - name: weekly-census
    description: "Publishes the XField weekly census card every Monday at 9am UTC"
    cron: "0 9 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/census"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: town-refresh
    description: "Re-reads every XField house daily, moves them, clears stale reserved houses, then publishes the daily paper"
    cron: "30 3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/refresh"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
